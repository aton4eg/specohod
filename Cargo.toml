[workspace]
resolver = "3"

members = ["stage1_discovery", "stage2_static_extractor", "stage3_annotate"]

default-members = [
    "stage1_discovery",
    "stage2_static_extractor",
    "stage3_annotate",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [""]
description = "Spec generation for Rust projects"
publish = false
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
anyhow = "1.0"
