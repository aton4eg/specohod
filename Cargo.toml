[workspace]
resolver = "2"

members = ["stage1_discovery", "stage2_static_extractor", "stage3_annotate"]

default-members = [
    "stage1_discovery",
    "stage2_static_extractor",
    "stage3_annotate",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
authors = ["KNS Group LLC ('YADRO')"]
description = "Spec generation for Rust projects"
publish = false
rust-version = "1.75.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
