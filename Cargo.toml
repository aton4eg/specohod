[workspace]
resolver = "3"

members = ["stage1_go_extractor","stage1_static_extractor", "stage2_annotate"]

default-members = [
    "stage1_go_extractor",
    "stage1_static_extractor",
    "stage2_annotate",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [""]
description = "Spec generation for Rust projects"
publish = false
rust-version = "1.97.1"

[workspace.dependencies]
anyhow = "1.0"
async-lsp = "0.2.4"
async-process = "2.5.0"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
lsp-types = "0.95"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "fs", "macros"] }
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.5"
